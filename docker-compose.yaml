x-airflow-common: &airflow-common
  image: apache/airflow:3.2.1
  build:
    context: .
    dockerfile: Dockerfile
    args:
      AIRFLOW_BASE_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.2.1}
  restart: unless-stopped
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__INTERNAL_API_URL: "http://airflow-apiserver:8080"
    AIRFLOW__WORKERS__BASE_URL: "http://airflow-apiserver:8080"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?AIRFLOW_API_SECRET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET}
    TZ: Asia/Tehran
    # Make the `jobs` package importable both by the DAG-parsing interpreter and
    # by the silver venv child that ExternalPythonOperator spawns.
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: pymongo confluent-kafka fastavro httpx==0.28.1 dbt-clickhouse
    _AIRFLOW_WWW_USER_CREATE: "true"
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD}
    _AIRFLOW_WWW_USER_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
    _AIRFLOW_WWW_USER_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
    _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./jobs:/opt/airflow/jobs
    - ./dbt_project:/opt/airflow/dbt_project
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - datalake_network
  depends_on:
    postgres-airflow:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - datalake_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      retries: 3
      start_period: 5s
      timeout: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      HOME: /tmp
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/bronze &&
      mc mb --ignore-existing local/warehouse
      "
    networks:
      - datalake_network
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - 8080:8080
      - 7077:7077
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    networks:
      - datalake_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${SPARK_MASTER_CPU_LIMIT:-1}
          memory: ${SPARK_MASTER_MEMORY_LIMIT:-1G}
        reservations:
          cpus: "0.25"
          memory: 256M

  spark-worker:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark-worker
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:?SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:?SPARK_WORKER_MEMORY}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - datalake_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${SPARK_WORKER_CPU_LIMIT:-3}
          memory: ${SPARK_WORKER_MEMORY_LIMIT:-3G}
        reservations:
          cpus: "0.5"
          memory: 1G

  bronze-ingestion:
    # PID 1 is the launcher (one spark-submit per topic). spark-submit spawns
    # grandchild JVM/python workers that get reparented to PID 1 when their
    # parent exits; the launcher only reaps its direct children, so those
    # grandchildren pile up as <defunct> zombies (observed 677, leaking
    # PIDs/memory into the cgroup OOM killer). init: true runs a tini reaper.
    init: true
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: bronze-ingestion
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPICS: ${KAFKA_TOPICS:?KAFKA_TOPICS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:?SCHEMA_REGISTRY_URL}
      KAFKA_STARTING_OFFSETS: ${KAFKA_STARTING_OFFSETS:-latest}
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL:-15 seconds}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MINIO_BUCKET: ${MINIO_BUCKET:-bronze}
      SPARK_MASTER_URL: spark://spark-master:7077
      # launcher divides these across topics so every app gets a fair, nonzero
      # core/memory share instead of the first apps exhausting either and
      # starving the rest (see launcher.py)
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:?SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:?SPARK_WORKER_MEMORY}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
    # launcher (plain python): spark-submits one job per topic in KAFKA_TOPICS.
    # Each topic's client-mode driver runs here, so this container hosts N JVMs.
    command: >
      python3 /opt/spark-apps/jobs/run_bronze_ingestion.py
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    depends_on:
      spark-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - datalake_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${BRONZE_INGESTION_CPU_LIMIT:-2}
          # N client-mode driver JVMs live here (one per topic) - size for the
          # topic count; --driver-memory is capped at 512m each in main.py.
          memory: ${BRONZE_INGESTION_MEMORY_LIMIT:-6G}
        reservations:
          cpus: "0.5"
          memory: 512M

  # Spark-side Iceberg maintenance: compaction + manifest rewrite, the
  # procedures pyiceberg 0.11.1 does not implement at all (see
  # jobs/iceberg_maintenance/main.py). Airflow's silver_maintenance handles the
  # pyiceberg-native half (branch sweep + expire_snapshots) and does NOT overlap
  # with this.
  #
  # profiles: keeps it out of `docker compose up -d` -- it is a run-to-completion
  # job, not a service. Invoke explicitly:
  #   docker compose run --rm iceberg-maintenance
  # Airflow cannot drive it: the image has no JVM or spark-submit by design
  # (design doc 6.2), and standalone Spark cannot run Python apps in cluster
  # mode, so the REST submission API is not an option either.
  iceberg-maintenance:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: iceberg-maintenance
    environment:
      ICEBERG_REST_URI: http://iceberg-rest:8181
      MINIO_ENDPOINT: http://minio:9000
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
      SILVER_NAMESPACE: ${SILVER_NAMESPACE:-silver}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    # Client mode against the existing standalone cluster, exactly like
    # bronze-ingestion. Modest resources: compaction is I/O bound and must not
    # starve the 8 bronze streaming apps sharing this worker.
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --driver-memory 512m
      --total-executor-cores 1
      --executor-memory 1g
      /opt/spark-apps/jobs/run_iceberg_maintenance.py
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    depends_on:
      spark-master:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    networks:
      - datalake_network
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1536M

  postgres-iceberg:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: postgres-iceberg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ICEBERG_DB_USER:?ICEBERG_DB_USER}
      POSTGRES_PASSWORD: ${ICEBERG_DB_PASSWORD:?ICEBERG_DB_PASSWORD}
      POSTGRES_DB: ${ICEBERG_DB_NAME:-iceberg}
      TZ: Asia/Tehran
    volumes:
      - iceberg_postgres_data:/var/lib/postgresql/data
    networks:
      - datalake_network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  iceberg-rest:
    build:
      context: .
      dockerfile: iceberg-rest/Dockerfile
    container_name: iceberg-rest
    networks:
      - datalake_network
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres-iceberg:
        condition: service_healthy
    ports:
      - 8181:8181
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH-STYLE-ACCESS: "true"
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres-iceberg:5432/${ICEBERG_DB_NAME:-iceberg}
      CATALOG_JDBC_USER: ${ICEBERG_DB_USER:?ICEBERG_DB_USER}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_DB_PASSWORD:?ICEBERG_DB_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9004:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD}
      # Consumed by clickhouse/init/10-realtime-monitoring.sh, which builds the
      # Kafka-engine tables behind the real-time monitoring dashboard. Same
      # external cluster the bronze ingestion reads.
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:?SCHEMA_REGISTRY_URL}
      MONITORING_RETENTION_HOURS: ${MONITORING_RETENTION_HOURS:-48}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # Runs only when the data volume is empty. On an already-provisioned
      # server run it by hand -- it is idempotent:
      #   docker compose exec clickhouse bash \
      #     /docker-entrypoint-initdb.d/10-realtime-monitoring.sh
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "${CLICKHOUSE_USER}",
          "--password",
          "${CLICKHOUSE_PASSWORD}",
          "--query",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped
    networks:
      - datalake_network

  metabase:
    image: metabase/metabase:v0.62.3.5
    container_name: metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "${MB_PORT:-3000}:3000"
    volumes:
      - metabase_data:/metabase-data
    networks:
      - datalake_network
      - traefik_traefik_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase-router.rule=Host(`mb.group2.querabootcamp-de.ir`)"
      - "traefik.http.routers.metabase-router.entrypoints=web"
      - "traefik.http.services.metabase-service.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_traefik_network"
    deploy:
      resources:
        limits:
          cpus: "1"
          # Metabase's JVM sizes its heap off the container's cgroup memory
          # limit (default MaxRAMPercentage=25%) -- 1G here left it with only
          # ~250MB heap, not enough to finish starting (OOM during driver
          # registration).
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G

  # Builds the ClickHouse connection, 24 questions and 6 dashboards in Metabase
  # from metabase/questions/*.sql. Profile-gated because it is a
  # run-to-completion job, not a service -- same reasoning as
  # iceberg-maintenance. Idempotent, so re-run it after editing a query:
  #
  #   docker compose --profile provision run --rm metabase-init
  #
  # Uses a stock python image and no pip install: provision.py is stdlib-only.
  metabase-init:
    profiles: ["provision"]
    image: python:3.12-slim
    container_name: metabase-init
    depends_on:
      metabase:
        condition: service_started
    environment:
      MB_URL: http://metabase:3000
      MB_ADMIN_EMAIL: ${MB_ADMIN_EMAIL:?MB_ADMIN_EMAIL}
      MB_ADMIN_PASSWORD: ${MB_ADMIN_PASSWORD:?MB_ADMIN_PASSWORD}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD}
      GOLD_DB: ${GOLD_DB:-gold}
    volumes:
      - ./metabase:/opt/metabase-provision:ro
    # The monitoring dashboard is excluded by default: ClickHouse's Kafka engine
    # cannot fetch from this project's broker (see metabase/README.md 4b), so
    # provisioning it would create seven cards that render empty. Drop the flag
    # once that transport issue is solved.
    command:
      - python3
      - /opt/metabase-provision/provision.py
      - --exclude-dashboard
      - Real-Time Pipeline Monitoring
    restart: "no"
    networks:
      - datalake_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres-airflow:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: postgres-airflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      TZ: Asia/Tehran
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datalake_network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    # DB migrate (via _AIRFLOW_DB_MIGRATE) runs first, then create the pool that
    # serialises Silver's Polars tasks so they can't OOM the 1.5G scheduler or
    # starve the bronze Spark apps (design doc §7.9).
    command: bash -c "airflow pools set silver_pool 1 'Serialize Silver Polars tasks (scheduler RAM bound)'"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8090}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://127.0.0.1:8080/api/v2/monitor/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 512M

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 512M

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}" || exit 1',
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}" || exit 1',
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  datalake_network:
    driver: bridge

  traefik_traefik_network:
    external: true

volumes:
  minio_data:
  postgres_data:
  iceberg_postgres_data:
  airflow_logs:
  clickhouse_data:
  clickhouse_logs:
  metabase_data:
