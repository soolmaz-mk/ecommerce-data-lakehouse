spark.hadoop.fs.s3a.endpoint            http://minio:9000
spark.hadoop.fs.s3a.path.style.access   true
spark.hadoop.fs.s3a.impl                org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.connection.timeout          5000
spark.hadoop.fs.s3a.connection.establish.timeout 5000
spark.hadoop.fs.s3a.attempts.maximum            3
spark.hadoop.fs.s3a.retry.limit                 3
spark.hadoop.fs.s3a.change.detection.mode       none
# S3A's internal I/O thread pool runs independent of Spark's core count, so
# even --total-executor-cores 1 still lets multiple S3 HTTP calls race
# concurrently. Observed via mc admin trace: some HEAD requests to MinIO come
# back 403 SignatureDoesNotMatch (not AccessDenied - Hadoop's S3A layer
# collapses both to the same exception) while identically-shaped requests
# succeed, using identical credentials - the signature of the wrong signing
# operation's known to race under concurrent use in older AWS SDK v1 signers.
# Forcing S3A's own I/O fully serial removes the race.
spark.hadoop.fs.s3a.threads.max                 1
spark.hadoop.fs.s3a.connection.maximum          2
